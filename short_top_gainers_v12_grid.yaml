# configs/short_top_gainers_v12_grid.yaml
strategy: short_top_gainers_bot_with_filters_v12
initial_equity: 18
position_notional: 3
max_notional_frac: 0.95
commission_pct: 0.0004
funding_per_hour_pct: 0.00002
slippage_pct: 0.0002

# Universe filters
min_qv_1h: 10000
min_qv_24h: 100000

# Mode: breakdown (default PF-high) або fade_gainers
mode: "breakdown"

# === Параметри для sweep'у ===
min_vol_surge_mult: 1.2         # [1.1, 1.2, 1.3]
min_atr_ratio: 0.01              # [0.01, 0.015, 0.02]
min_momentum_sum: 0.06           # [0.04, 0.05, 0.06, 0.07]
trail_start_atr: 1.0             # [0.8, 1.0, 1.2]
mom_flip_thresh: 0.01            # [0.005, 0.01, 0.02]
max_hold_hours: 72               # [48, 72, 96]

# Risk & exits
stop_mae_atr: 2.5
tp_atr: 3.0

# Bars for quick test
limit_bars: 500

# Time
open_hour_kyiv: 2
timeframe: "1h"
