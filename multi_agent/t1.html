<!doctype html>
<html lang="uk">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>GLB + WebXR (Orbit + Two-Controller Scale)</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0e12}
  canvas.webgl{display:block}
  /* щоби VR-кнопка була поверх у правому нижньому куті */
  #VRButton{position:fixed !important; right:16px; bottom:16px; left:auto !important; top:auto !important; z-index:10000}
  /* підказка */
  #hint{position:fixed;left:12px;top:12px;color:#eaeaea;background:rgba(20,24,28,.7);padding:8px 10px;border-radius:10px;font:14px system-ui}
</style>

<div id="hint">VR: затисни <b>тригери</b> на <b>обох</b> контролерах і розводь/зводь — модель масштабується.</div>
<canvas class="webgl"></canvas>

<!-- IMPORT MAP: резолвить "three" та "three/examples/jsm/" без бандлера -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.163.0/build/three.module.js",
    "three/examples/jsm/": "https://unpkg.com/three@0.163.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/examples/jsm/controls/OrbitControls.js";
import { GLTFLoader } from "three/examples/jsm/loaders/GLTFLoader.js";
import { RGBELoader } from "three/examples/jsm/loaders/RGBELoader.js";
import { VRButton } from "three/examples/jsm/webxr/VRButton.js";
import { XRControllerModelFactory } from "three/examples/jsm/webxr/XRControllerModelFactory.js";

const MODEL_URL = "https://vps2.happyuser.info/Demos/Frank/Franks_model_4s.glb";

const canvas = document.querySelector("canvas.webgl");
const scene = new THREE.Scene();
let renderer, camera, controls;

// Група, яку масштабуємо жестом
const modelRoot = new THREE.Group();
scene.add(modelRoot);

// Стан для дворукого масштабу
let controller1, controller2, grip1, grip2;
let selecting1=false, selecting2=false;
let baseDistance=0, baseScale=1;
const SCALE_MIN=0.25, SCALE_MAX=4.0;

init();
renderer.setAnimationLoop(loop);

function init(){
  // Renderer спочатку (для PMREM)
  renderer = new THREE.WebGLRenderer({ antialias:true, canvas });
  renderer.setPixelRatio(devicePixelRatio);
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  // WebXR + VRButton
  renderer.xr.enabled = true;
  document.body.appendChild(VRButton.createButton(renderer));

  // Camera
  camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.25, 50);
  camera.position.set(-18, 6, 27);

  // OrbitControls (desktop). У VR відключаємо.
  controls = new OrbitControls(camera, renderer.domElement);
  controls.minDistance = 2;
  controls.maxDistance = 50;
  controls.target.set(0, 0, -0.2);
  controls.addEventListener("change", renderOnce);
  renderer.xr.addEventListener?.("sessionstart", ()=> controls.enabled=false);
  renderer.xr.addEventListener?.("sessionend",   ()=> controls.enabled=true);

  // Антураж: HDR IBL (бекграунд + environment)
  new RGBELoader().setDataType(THREE.UnsignedByteType)
    .load("https://cdn.jsdelivr.net/gh/mrdoob/three.js@master/examples/textures/equirectangular/royal_esplanade_1k.hdr",
      (texture)=>{
        const pmrem = new THREE.PMREMGenerator(renderer);
        pmrem.compileEquirectangularShader();
        const envMap = pmrem.fromEquirectangular(texture).texture;
        scene.environment = envMap;
        scene.background  = envMap;
        texture.dispose(); pmrem.dispose();
        renderOnce();
      });

  // Додаткове світло до HDR
  scene.add(new THREE.HemisphereLight(0xffffff, 0x222222, 0.7));
  const dir = new THREE.DirectionalLight(0xffffff, 0.5);
  dir.position.set(3,5,2);
  scene.add(dir);

  // Підлога
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(20,20),
    new THREE.MeshStandardMaterial({ color:0x101418 })
  );
  ground.rotation.x = -Math.PI/2;
  //scene.add(ground);

  // XR контролери + візуальні моделі контролерів
  const factory = new XRControllerModelFactory();

    new RGBELoader()
    .setDataType(THREE.UnsignedByteType)
    .load(
      "https://cdn.jsdelivr.net/gh/mrdoob/three.js@master/examples/textures/equirectangular/royal_esplanade_1k.hdr",
      (texture) => {
        const pmrem = new THREE.PMREMGenerator(renderer);
        pmrem.compileEquirectangularShader();
        const envMap = pmrem.fromEquirectangular(texture).texture;
        scene.background = envMap;
        scene.environment = envMap;
        texture.dispose();
        pmrem.dispose();
        render();
      }
    );


  controller1 = renderer.xr.getController(0);
  controller1.addEventListener("selectstart", ()=>{ selecting1=true; beginTwoHandIfReady(); });
  controller1.addEventListener("selectend",   ()=>{ selecting1=false; /* no-op */ });
  scene.add(controller1);

  controller2 = renderer.xr.getController(1);
  controller2.addEventListener("selectstart", ()=>{ selecting2=true; beginTwoHandIfReady(); });
  controller2.addEventListener("selectend",   ()=>{ selecting2=false; /* no-op */ });
  scene.add(controller2);

  grip1 = renderer.xr.getControllerGrip(0);
  grip1.add( factory.createControllerModel(grip1) );
  scene.add(grip1);

  grip2 = renderer.xr.getControllerGrip(1);
  grip2.add( factory.createControllerModel(grip2) );
  scene.add(grip2);

  // GLB модель
  const loader = new GLTFLoader();
  loader.load(
    MODEL_URL,
    (gltf)=>{
      const obj = gltf.scene;
      obj.scale.setScalar(0.1);   // масштаб 0.5
      modelRoot.add(obj);
      renderOnce();
    },
    undefined,
    (err)=> console.error("GLB load error:", err)
  );

  addEventListener("resize", onResize);
}

// Центруємо модель, кладемо «на бік» і ставимо на підлогу
function centerLayAndPlace(obj){
  const box = new THREE.Box3().setFromObject(obj);
  const c = box.getCenter(new THREE.Vector3());
  obj.position.sub(c);            // центр → (0,0,0)

  obj.rotation.z = Math.PI/2;     // «лежить на боці»

  obj.updateWorldMatrix(true,true);
  const box2 = new THREE.Box3().setFromObject(obj);
  obj.position.y += -box2.min.y;  // низ на y=0
}

// Дворучний масштаб (обидва тригери затиснуті)
function beginTwoHandIfReady(){
  if(!(selecting1 && selecting2)) return;
  if(!modelRoot) return;
  baseDistance = grip1.position.distanceTo(grip2.position);
  baseScale = modelRoot.scale.x || 1;
}
function applyTwoHandScale(){
  if(!(selecting1 && selecting2)) return;
  if(baseDistance <= 0) return;
  const d = grip1.position.distanceTo(grip2.position);
  let s = baseScale * (d / baseDistance);
  s = Math.max(SCALE_MIN, Math.min(SCALE_MAX, s));
  modelRoot.scale.setScalar(s);
}

// Рендер-петля
function loop(_t, dt){
  if(!dt) dt=16; dt/=1000;
  applyTwoHandScale();
  renderer.render(scene, camera);
}

function renderOnce(){ renderer.render(scene, camera); }

function onResize(){
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderOnce();
}
</script>
</html>
