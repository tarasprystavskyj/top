<!doctype html>
<html lang="uk">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>GLB + WebXR (grab / 2-hand move-rotate-scale) + robust HDR</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0e12}
  canvas.webgl{display:block}
  #VRButton{position:fixed !important; right:16px; bottom:16px; z-index:10000}
  #hint{position:fixed;left:12px;top:12px;color:#eaeaea;background:rgba(20,24,28,.7);padding:8px 10px;border-radius:10px;font:14px system-ui}
</style>

<div id="hint">VR: 1 тригер — взяти/перетягнути • 2 тригери — рух/оберт/масштаб.</div>
<canvas class="webgl"></canvas>

<!-- One version of three everywhere -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.163.0/build/three.module.js",
    "three/examples/jsm/": "https://unpkg.com/three@0.163.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/examples/jsm/controls/OrbitControls.js";
import { GLTFLoader } from "three/examples/jsm/loaders/GLTFLoader.js";
import { RGBELoader } from "three/examples/jsm/loaders/RGBELoader.js";
import { VRButton } from "three/examples/jsm/webxr/VRButton.js";
import { XRControllerModelFactory } from "three/examples/jsm/webxr/XRControllerModelFactory.js";
import { RoomEnvironment } from "three/examples/jsm/environments/RoomEnvironment.js";

const MODEL_URL = "https://vps2.happyuser.info/Demos/Frank/Franks_model_4s.glb";

// Multiple HDR mirrors pinned to r163
const HDR_SOURCES = [
  "https://unpkg.com/three@0.163.0/examples/textures/equirectangular/royal_esplanade_1k.hdr",
  "https://cdn.jsdelivr.net/gh/mrdoob/three.js@r163/examples/textures/equirectangular/royal_esplanade_1k.hdr",
  "https://raw.githubusercontent.com/mrdoob/three.js/r163/examples/textures/equirectangular/royal_esplanade_1k.hdr"
];

const canvas = document.querySelector("canvas.webgl");
const scene = new THREE.Scene();
let renderer, camera, controls;

// Root we move/rotate/scale
const modelRoot = new THREE.Group();
scene.add(modelRoot);

// XR state
let controller1, controller2, grip1, grip2;
let selecting1=false, selecting2=false;
let oneHandGrabber=null;

// two-hand bases
let baseDistance=0, baseScale=1;
let baseVec = new THREE.Vector3();
let baseQuat = new THREE.Quaternion();

const SCALE_MIN=0.1, SCALE_MAX=5.0;

init();
renderer.setAnimationLoop(loop);

function init(){
  // Renderer
  renderer = new THREE.WebGLRenderer({ antialias:true, canvas });
  renderer.setPixelRatio(devicePixelRatio);
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  // WebXR
  renderer.xr.enabled = true;
  document.body.appendChild(VRButton.createButton(renderer));

  // Camera + orbit
  camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 200);
  camera.position.set(2.5, 1.6, 3.5);
  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0.5, 0);
  controls.minDistance = 0.3;
  controls.maxDistance = 20;
  controls.addEventListener("change", renderOnce);
  renderer.xr.addEventListener?.("sessionstart", ()=>controls.enabled=false);
  renderer.xr.addEventListener?.("sessionend",   ()=>controls.enabled=true);

  // Tiny lights so model isn’t fully dark before HDR is ready
  scene.add(new THREE.HemisphereLight(0xffffff, 0x222222, 0.5));
  const dir = new THREE.DirectionalLight(0xffffff, 0.4); dir.position.set(3,5,2); scene.add(dir);

  // Robust HDR load
  loadHDRSequential(HDR_SOURCES).then((envMap)=>{
    if (envMap){
      scene.background  = envMap;
      scene.environment = envMap;
    } else {
      console.warn("All HDR sources failed. Using RoomEnvironment fallback.");
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
      scene.background = new THREE.Color(0x0b0e12);
    }
    renderOnce();
  });

  // Controllers
  const factory = new XRControllerModelFactory();
  controller1 = renderer.xr.getController(0);
  controller2 = renderer.xr.getController(1);
  controller1.addEventListener("selectstart", ()=>{ selecting1=true; handleGrabChange(controller1); });
  controller1.addEventListener("selectend",   ()=>{ selecting1=false; handleGrabChange(controller1); });
  controller2.addEventListener("selectstart", ()=>{ selecting2=true; handleGrabChange(controller2); });
  controller2.addEventListener("selectend",   ()=>{ selecting2=false; handleGrabChange(controller2); });
  scene.add(controller1, controller2);
  grip1 = renderer.xr.getControllerGrip(0); grip1.add(factory.createControllerModel(grip1));
  grip2 = renderer.xr.getControllerGrip(1); grip2.add(factory.createControllerModel(grip2));
  scene.add(grip1, grip2);

  // Model
  const loader = new GLTFLoader();
  loader.load(MODEL_URL, (gltf)=>{
    const obj = gltf.scene;
    obj.scale.setScalar(0.1);
    modelRoot.add(obj);
    renderOnce();
  }, undefined, (err)=> console.error("GLB load error:", err));

  addEventListener("resize", onResize);
}

// Try a list of HDR URLs in order; return PMREM texture or null
async function loadHDRSequential(urls){
  const loader = new RGBELoader();
  for (const url of urls){
    try {
      const tex = await new Promise((res, rej)=> loader.load(url, res, undefined, rej));
      const pmrem = new THREE.PMREMGenerator(renderer);
      pmrem.compileEquirectangularShader();
      const envMap = pmrem.fromEquirectangular(tex).texture;
      tex.dispose(); pmrem.dispose();
      return envMap;
    } catch (e){
      console.warn("HDR source failed:", url, e);
    }
  }
  return null;
}

// ----- Grab logic -----
function handleGrabChange(requester){
  if (selecting1 && selecting2){
    if (oneHandGrabber){ scene.attach(modelRoot); oneHandGrabber=null; }
    beginTwoHand();
    return;
  }
  if (selecting1 ^ selecting2){
    if (oneHandGrabber && oneHandGrabber!==requester){ scene.attach(modelRoot); oneHandGrabber=null; }
    if (!oneHandGrabber){ requester.attach(modelRoot); oneHandGrabber=requester; }
  } else {
    if (oneHandGrabber){ scene.attach(modelRoot); oneHandGrabber=null; }
  }
}
function beginTwoHand(){
  const p1 = grip1.position, p2 = grip2.position;
  baseDistance = p1.distanceTo(p2);
  baseScale    = modelRoot.scale.x || 1;
  baseVec.copy(p2).sub(p1).normalize();
  baseQuat.copy(modelRoot.quaternion);
}
function updateTwoHand(){
  if(!(selecting1 && selecting2) || baseDistance<=0) return;
  // scale
  const d = grip1.position.distanceTo(grip2.position);
  let s = baseScale * (d / baseDistance);
  s = Math.max(SCALE_MIN, Math.min(SCALE_MAX, s));
  modelRoot.scale.setScalar(s);
  // rotate
  const curr = new THREE.Vector3().subVectors(grip2.position, grip1.position).normalize();
  const dq = new THREE.Quaternion().setFromUnitVectors(baseVec, curr);
  modelRoot.quaternion.copy(dq).multiply(baseQuat);
  // move
  modelRoot.position.copy(grip1.position).add(grip2.position).multiplyScalar(0.5);
}

// ----- Loop / utils -----
function loop(_t, dt){
  if(!dt) dt=16; dt/=1000;
  updateTwoHand();
  renderer.render(scene, camera);
}
function renderOnce(){ renderer.render(scene, camera); }
function onResize(){
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderOnce();
}
</script>
</html>
