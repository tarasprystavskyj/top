# базується на твоєму best; ключові фрагменти:
cache_db: ../combined_cache_5m_5000.db
strategy_class: strategies.breakout_avaai_full_sized.BreakoutAVAAIFullSized
strategy_params:
  side: LONG
  top_n: 10
  length: 10
  macd_filter: 1
  volume_length: 20
  adx_length: 14
  adx_threshold: 15
  atr_threshold_ratio: 0.0022
  tp_atr_mult: 3.75
  sl_atr_mult: 1.04
min_atr_ratio: 0
min_momentum_sum: 0
portfolio:
  position_notional: 100
  initial_equity: 100.0
  max_notional_frac: 1.5         # або навіть 10.0, якщо хочеш фактично відключити кап
  fee_rate: 0.001
  slippage_per_side: 0.0003
open_on_heat: false
session:
  open_every_bar: true
side: LONG
top-n: 8

sizer:
  enabled: false
  lookback_trades: 3
  min_mult: 0.5
  max_mult: 1.8
  ret_mean_floor: -0.01
  ret_mean_ceiling: 0.03
  perf_mult_low: 0.6
  perf_mult_high: 1.4
  winrate_floor: 0.45
  winrate_ceiling: 0.65
  win_mult_low: 0.8
  win_mult_high: 1.2
  conf_mult_low: 0.7
  conf_mult_high: 1.3
  conf_weights:
    momentum: 0.4
    volume: 0.2
    atr_trend: 0.2
    adx: 0.2
  dd_softcap: 0.12
  dd_gamma: 2.5
