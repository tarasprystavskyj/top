# configs/cfg_speed3_breakout_avaai_long.yaml
# LONG-biased run (BOTH path in core opens LONGs). For SHORTs, use the short YAML below.
cache_db: "../combined_cache_5m_500b.db"
strategy_class: strategies.breakout_avaai_adapter.BreakoutAVAAI

# Portfolio & execution
portfolio:
  initial_equity: 100.0
  position_notional: 15.0
  fee_rate: 0.0007
  slippage_per_side: 0.0003
  max_notional_frac: 0.6

# Strategy params consumed by the core + adapter
strategy_params:
  top_n: 12
  side: "BOTH"          # core gating path; BOTH uses LONG branch
  tp_atr_mult: 2.8      # take-profit = entry ± 2.8 * (atr_ratio * close)
  sl_atr_mult: 1.2      # stop-loss  = entry ∓ 1.2 * (atr_ratio * close)
  bias: "AUTO"          # adapter picks side by momentum sign
  mom_threshold: 0.0    # AUTO dead-zone; 0 uses any sign flip

# Core prefilters (strongly affect which trades open)
min_atr_ratio: 0.0015
min_momentum_sum: 0.015
min_qv_24h: 0.0
min_qv_1h: 0.0
