# Thin-backtester configuration for the Cryptomine DCA strategy.
#
# Usage:
#   python obw_platform/backtester_core_speed3_veto_universe_2.py \
#       --cfg obw_platform/configs/cryptomine.yaml \
#       --limit-bars 2880
cache_db: "combined_cache_3m_14400_24u.db"
strategy_class: strategies.cryptomine_strategy.CryptomineStrategy
limit_bars: 2880

timeframe: "1h"

portfolio:
  initial_equity: 100.0
  position_notional: 5.0   # matches first_buy_usdt by default
  fee_rate: 0.0007
  slippage_per_side: 0.0003
  max_notional_frac: 0.6

strategy_params:
  first_buy_usdt: 5.0
  margin_call_limit: 5
  margin_call_drop: 0.5
  tp_percent: 1.3
  callback_percent: 0.2
  auto_merge: true
  nonlinear_multipliers: [1.0, 1.5, 1.0, 2.0, 3.5]
  capital_per_coin: 100.0
  sl_enabled: false
  sl_type: from_avg
  sl_value_percent: 5.0
  timeframe: "1h"
