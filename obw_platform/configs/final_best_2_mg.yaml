# ============================================================
# Cryptomine — Martingale grid до Fib 0.618 (90% equity MTM)
# ============================================================

live: false
source: ccxt

ccxt_exchange: bingx
ccxt_symbol_format: usdtm

cache_db: "combined_cache_BYBIT_1m_1Y_1u.db"

# -----------------------
# Таймфрейм / сесія
# -----------------------
timeframe: "1m"
open_hour_kyiv: 2
kyiv_offset_hours: 3
force_start_always: true

# -----------------------
# Universe
# -----------------------
quote: "USDT"
symbols:
  - ENA/USDT:USDT

max_universe: 1
min_qv_24h: 100000

# -----------------------
# Комісії / сліпедж
# -----------------------
commission_type: percent
commission_value: 0.0
slippage_bps: 0.0

# -----------------------
# Капітал
# -----------------------
initial_equity: 100.0

# ============================================================
# STRATEGY
# ============================================================
strategy_class: strategies.cryptomine_martingale_fib618.CryptomineMartingaleFib618V2

strategy_params:
  firstBuyUSDT: 5.0

  gridSteps: 244
  budgetFrac: 0.90
  hardCapFrac: 0.99

  pminLookbackBars: 43200     # ~30d на 1m

  fibLevel: 0.618
  atrHTFBars: 60              # 1h ATR якщо base 1m
  atrLen: 14
  atrPctRef: 0.02
  confMin: 0.35
  confMax: 1.0
  fibMin: 0.20
  fibMax: 0.618

  maxBuyMult: 8.0             # tail-risk control (впливає на km_max)

  timeDecayBars: 0            # 0 = OFF; наприклад 100000 для ~69 днів на 1m
  decaySellFrac: 0.10
  minProfitForDecay: 0.001
# ============================================================
# BACKTEST
# ============================================================
plots:
  enable: true
  path: plots_1m_v2

save_trades: true
save_equity_curve: true
