# cfg_avaai_t3m14400_4.yaml
# 3m версія на базі cfg_avaai_t5m5000_4.yaml
# Мінімально потрібні ключі для бек-тестера: strategy_class, cache_db
# Інші поля зручно тримати тут як параметри стратегії.

# Клас стратегії (модуль.НазваКласу)
strategy_class: "strategies.breakout_avaai_full_with_universe_4.BreakoutAVAAIFull"

# Кеш-БД (онови шлях за своїм середовищем; можна передавати і через --cache_db)
cache_db: "DB/combined_cache_3m_14400_30u.db"

# Інформативні поля (бек-тестер їх не читає, але тримаємо для читабельності/сумісності)
tf: "3m"
timeframe: "3m"

# (Опціонально) план тюнера
plan: "tuner_plan_avaai_3m.py"

# Параметри стратегії (верхній рівень перекриває strategy_params)
# За замовчуванням залишаю значення, що відповідають профілю v4.
side: "BOTH"                 # LONG | SHORT | BOTH
top_n: 8                     # скільки символів відбирати після ранжування

# Вхідні фільтри
min_atr_ratio: 0.02          # мінімальна відносна ATR (0..1)
min_momentum_sum: 0.036        # 0.0 вимикає поріг по моментуму (як у твоїх прибуткових прогонів)

# TP/SL як кратні ATR
tp_atr_mult: 3.8
sl_atr_mult: 0.5

# Вартість торгівлі та ковзання (налаштуй під свою біржу)
fee_rate: 0.0004             # ~0.04% за бік
slippage_per_side: 0.0005    # ~0.05% ковзання на бік

# Вихід по "heat"
exit_on_heat: true
heat_exit_threshold: 0.85    # виходити, якщо heat < порогу
heat_exit_min_rr: 1.05       # мінімальне RR для виходу по heat

# Частковий тейк-профіт
partial_tp_enable: true
partial_tp_frac: 0.50
partial_trigger_frac_of_tp: 0.50

# Ліквідність (за замовчуванням ліберально; можеш підняти)
min_qv_24h: 0.0
min_qv_1h: 0.0

# Мінімальні розміри (щоб не відкривати занадто малі позиції)
exchange_min_notional: 2.2
min_qty: 0.0

# (Опційно) згрупувати параметри також у блоці strategy_params (не обов'язково)
strategy_params:
  side: "BOTH"
  top_n: 8
  min_atr_ratio: 0.02
  min_momentum_sum: 0.036
  tp_atr_mult: 3.8
  sl_atr_mult: 0.5
  fee_rate: 0.0004
  slippage_per_side: 0.0005
  exit_on_heat: true
  heat_exit_threshold: 0.40
  heat_exit_min_rr: 1.05
  partial_tp_enable: true
  partial_tp_frac: 0.50
  partial_trigger_frac_of_tp: 0.50
  min_qv_24h: 0.0
  min_qv_1h: 0.0
  exchange_min_notional: 2.2
  min_qty: 0.0
  max_new_positions_per_bar: 0
  first_bar_max_positions: 0
